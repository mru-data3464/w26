<h2 id="nonlinear-transforms">Nonlinear transforms</h2>

<ul>
<li>Common case: count data</li>
<li>Example: Ask 1000 students how often they checked D2L that day</li>
<li>Not a Gaussian distribution!</li>
<li>What about the central limit theorem?</li>
</ul>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" data-marpit-pagination="8" style="--paginate:true;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">
<h2 id="transformations-in-training-vs-inference">Transformations in training vs inference</h2>
<ul>
<li>Define functions, e.g.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">standardize</span>(<span class="hljs-params">X, mu, sigma</span>):
    <span class="hljs-keyword">return</span> (X - mu) / sigma
</code></pre>
</li>
<li>Compute scaling parameters <strong>on the training data</strong>, then stash them somewhere:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">mu = X_train.mean()
sigma = X_train.std()
<span class="hljs-comment"># ... later on, during inference</span>
X = standardize(X, mu, sigma)
</code></pre>
<blockquote>
<p>What would happen if <code>standardize</code> instead computed values on the fly?<br />
What else am I missing here?</p>
</blockquote>
</li>
</ul>
</section>

<h2 id="manual-approach-in-the-wild">Manual approach in the wild</h2>
<p>You may run across <a href="https://en.wikipedia.org/wiki/Magic_number_(programming)">magic numbers</a>, e.g from the <a href="https://docs.pytorch.org/tutorials/beginner/data_loading_tutorial.html">PyTorch tutorials</a>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch
<span class="hljs-keyword">from</span> torchvision <span class="hljs-keyword">import</span> transforms, datasets

data_transform = transforms.Compose([
        transforms.RandomResizedCrop(<span class="hljs-number">224</span>),
        transforms.RandomHorizontalFlip(),
        transforms.ToTensor(),
        transforms.Normalize(mean=[<span class="hljs-number">0.485</span>, <span class="hljs-number">0.456</span>, <span class="hljs-number">0.406</span>],
                             std=[<span class="hljs-number">0.229</span>, <span class="hljs-number">0.224</span>, <span class="hljs-number">0.225</span>])
    ])
</code></pre>
<p>This really should have a comment! Derived from <a href="https://www.image-net.org/index.php">ImageNet</a>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" data-marpit-pagination="10" style="--paginate:true;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">
<h2 id="an-alternative-solution-scikit-learn-pipelines">An alternative solution: Scikit-learn <code>Pipeline</code>s</h2>
<ul>
<li>Hard-coding scaling (and other) parameters is okay, provided you can <strong>justify the choice</strong> and <strong>document where they came from</strong></li>
<li>Scikit-learn has a handy <a href="https://scikit-learn.org/stable/modules/generated/sklearn.pipeline.Pipeline.html">Pipeline</a> class that handles this for you</li>
<li>Each step in the pipeline has a <code>fit</code> and <code>transform</code> method
<ul>
<li><code>fit</code> computes parameters from the training data</li>
<li><code>transform</code> applies the transformation</li>
<li><code>fit_transform</code> does both -- <strong>only use on training data!</strong></li>
</ul>
</li>
<li>You can call these functions on the whole pipeline to fit or apply all in one go</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" data-marpit-pagination="11" style="--paginate:true;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">
<h2 id="pipeline"><code>Pipeline</code></h2>
<ul>
<li>The <a href="https://scikit-learn.org/stable/modules/generated/sklearn.pipeline.Pipeline.html">Pipeline</a> class chains things together in a linear fashion</li>
<li>Output from one step is input to the next</li>
<li><code>make_pipeline</code> is slightly simpler syntax (no names needed)<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.pipeline <span class="hljs-keyword">import</span> make_pipeline, Pipeline
pipeline = make_pipeline(
    StandardScaler(),
    SGDClassifier()
)
<span class="hljs-comment"># or, equivalently:</span>
pipeline = Pipeline([
    (<span class="hljs-string">&#x27;scaler&#x27;</span>, StandardScaler()),
    (<span class="hljs-string">&#x27;sgd&#x27;</span>, SGDClassifier())
])
</code></pre>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="code_reminder" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" class="code_reminder" data-marpit-pagination="12" style="--paginate:true;--class:code_reminder;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">
<h2 id="columntransformer"><code>ColumnTransformer</code></h2>

<ul>
<li>The <a href="https://scikit-learn.org/stable/modules/generated/sklearn.compose.ColumnTransformer.html">ColumnTransformer</a> selects specific features and processes in parallel</li>
<li>Most of the time mixed dataset need this<br />
<img src="../img/05-column-transform.png" alt="center" style="height:300px;" /></li>
</ul>
<footer>From Scikit-learn <a href="https://scikit-learn.org/stable/auto_examples/compose/plot_column_transformer_mixed_types.html">Column transformer</a> example.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" data-marpit-pagination="13" style="--paginate:true;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">

<h2 id="linear-discriminant-analysis-lda">Linear discriminant analysis (LDA)</h2>
<ul>
<li>Similar to PCA, but <strong>supervised</strong></li>
<li>Finds basis that maximize <strong>class separability</strong></li>
<li>Number of projection vectors must be <code>&lt;= min(n_classes - 1, n_features)</code></li>
<li>Still uses projections and eigenvalues, but adds some statistical magic</li>
<li>Key assumptions:
<ul>
<li>Features are normally distributed within a class</li>
<li>Classes have identical covariance matrices</li>
</ul>
</li>
<li>Implemented in Scikit-learn as <a href="https://scikit-learn.org/stable/modules/generated/sklearn.discriminant_analysis.LinearDiscriminantAnalysis.html">LinearDiscriminantAnalysis</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" data-marpit-pagination="20" style="--paginate:true;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">
<h2 id="other-methods">Other methods</h2>
<ul>
<li>It seems crazy, but <a href="https://scikit-learn.org/stable/modules/random_projection.html">random projections</a> can work to reduce dimensionality</li>
<li>Another many:many transformation that has gained popularity in the &quot;Deep Learning era&quot; is the <strong>autoencoder</strong></li>
<li>These are (typically) neural networks that learn a lower-dimensional representation by training the output to match the input</li>
<li>The &quot;bottleneck&quot; layer in the middle is the reduced representation</li>
<li>During inference, the model is chopped in half</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" data-marpit-pagination="21" style="--paginate:true;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">
<h2 id="pros-and-cons-of-dimensionality-reduction">Pros and cons of dimensionality reduction</h2>
<div class="columns">
<div>
<h3 id="pros">Pros</h3>
<ul>
<li>Can improve model by:
<ul>
<li>removing noise</li>
<li>reducing collinearity</li>
</ul>
</li>
<li>Lower complexity/compute cost</li>
<li>Can help with visualization</li>
<li>Can be informative about features</li>
</ul>
</div>
<div>
<h3 id="cons">Cons</h3>
<ul>
<li>Throwing out information</li>
<li>Harder to interpret results</li>
<li>May not actually improve anything</li>
</ul>
</div>
</div>
<blockquote>
<p>Higher list of pros, but still... don't do it unless it's demonstrably beneficial</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-heading-divider="2" data-theme="q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf" lang="C" data-marpit-pagination="22" style="--paginate:true;--heading-divider:2;--theme:q2k77ijqj6pu1nvmon9zonqm6cgnin8h9oelqf0wqf;" data-marpit-pagination-total="23">
<h2 id="summary">Summary</h2>
<ul>
<li>Numerical data often needs to be transformed to fit model assumptions</li>
<li>Standardizing (and maybe normalizing) are very common</li>
<li>Nonlinear transformations can also be beneficial</li>
<li>Dimensionality reduction can help with model or visualization</li>
<li>As usual, <strong>let the data be your guide</strong></li>
</ul>
</section>
